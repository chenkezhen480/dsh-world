name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check / ${{ matrix.os }} / ${{ matrix.dsh }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dsh: [locked, 0.2.2-rc.1]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install locked development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install newer DSH test composition
        if: matrix.dsh != 'locked'
        env:
          DSH_TEST_VERSION: ${{ matrix.dsh }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const name of Object.keys(manifest.devDependencies)) {
            if (name.startsWith('@deepseek-ai/dsh-')) manifest.devDependencies[name] = process.env.DSH_TEST_VERSION;
          }
          manifest.devDependencies['@deepseek-ai/dsh-tool-executor-native'] = process.env.DSH_TEST_VERSION;
          manifest.devDependencies['@deepseek-ai/cordis'] = '4.1.0';
          manifest.devDependencies['@deepseek-ai/schemastery'] = '3.19.0';
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Node regression tests
        run: npm test -- --test-concurrency=2

      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/ecosystem/wechat/windows/requirements.txt

      - name: Install WeChat adapter dependencies
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check -r src/ecosystem/wechat/windows/requirements.txt

      - name: WeChat offline regression tests
        if: runner.os == 'Windows'
        working-directory: src/ecosystem/wechat/windows
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Build compiled package
        run: npm run build

      - name: Pack checked build
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts

      - name: Install and smoke-test the packed plugin
        run: npm run test:package

      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: dsh-world-${{ runner.os }}-${{ matrix.dsh }}-node24
          path: artifacts/*.tgz
          if-no-files-found: error

  core-node22:
    name: Core entry / Node 22 without QQ SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning --test tests/entry.test.ts
